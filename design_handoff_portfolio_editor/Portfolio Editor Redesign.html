<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Editor — Composer + Theme Picker</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Noto Sans JP", -apple-system, system-ui, sans-serif; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="artboards/mock.jsx"></script>
<script type="text/babel" src="artboards/v2-composer.jsx"></script>
<script type="text/babel" src="artboards/v2-composer-theme.jsx"></script>
<script type="text/babel" src="artboards/portfolio-output.jsx"></script>
<script type="text/babel" src="artboards/portfolio-output-2.jsx"></script>

<script type="text/babel" data-presets="react">
  const Canvas = window.DesignCanvas;
  const Section = window.DCSection;
  const Artboard = window.DCArtboard;

  function App() {
    return (
      <Canvas title="Portfolio Editor — Composer 採用版" subtitle="エディター = Composer / 出力テーマ = ユーザーが4つから選択">
        <Section
          id="picker"
          title="テーマピッカー (Composer 内)"
          subtitle="ThemeForm をリッチにし、4つの出力スタイルから選べるように"
        >
          <Artboard id="cp2" label="Composer · テーマセクション選択中" width={1440} height={900}>
            <CP2Editor />
          </Artboard>
        </Section>

        <Section
          id="output"
          title="選択肢になる4つのテーマ"
          subtitle="どれが選ばれてもキレイに出力されることを確認"
        >
          <Artboard id="po-ed" label="A · Editorial — 紙・セリフ・縦リズム" width={760} height={1700}>
            <POEditorial />
          </Artboard>
          <Artboard id="po-mo" label="B · Mono — ダーク・コード寄り" width={760} height={1700}>
            <POMono />
          </Artboard>
          <Artboard id="po-card" label="C · Card — Notion風カード整列" width={760} height={1700}>
            <POCard />
          </Artboard>
          <Artboard id="po-min" label="D · Minimal — 白・余白・タイポ" width={760} height={1700}>
            <POMinimal />
          </Artboard>
        </Section>

        <Section
          id="ref"
          title="参考: エディター本体 (Composer 通常画面)"
          subtitle="プロジェクト編集中のステート"
        >
          <Artboard id="cp1" label="Composer · プロジェクト編集中" width={1440} height={900}>
            <CPEditor />
          </Artboard>
        </Section>
      </Canvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
